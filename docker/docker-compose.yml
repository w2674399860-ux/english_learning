services:
  mysql:
    image: mysql:8.4.11
    container_name: english_mysql
    ports:
      # 只绑定本机回环地址；主机端口 3307（本机 MySQL 8.0 占用 3306，不碰）
      - "127.0.0.1:3307:3306"
    environment:
      # 值来自同目录 docker/.env；初始化脚本会检查是否已设置
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_APP_USER: ${MYSQL_APP_USER:-english_app}
      MYSQL_APP_PASSWORD: ${MYSQL_APP_PASSWORD}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # 走 TCP：初始化阶段的临时服务器只监听 socket，不会被误判为健康；
      # 服务器在运行时 mysqladmin ping 即返回 0（即使认证被拒），无需密码
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    restart: unless-stopped
    networks:
      - app_network

  paddle_ocr:
    build:
      context: ./paddle_ocr
      dockerfile: Dockerfile
    image: paddle_ocr_service:latest
    container_name: english_ocr
    ports:
      # 只给本地直跑的后端用；容器内的后端走服务名，不经过这个端口
      - "127.0.0.1:8866:8866"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    networks:
      - app_network
    environment:
      - PYTHONUNBUFFERED=1

  backend:
    build:
      context: ../backend_fastapi
      dockerfile: Dockerfile
      # 国内网络可打开：
      # args:
      #   PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
    image: english_backend_service:latest
    container_name: english_backend
    ports:
      # 绑定所有网卡：局域网真机调试需要。只在本机使用时可改为 "127.0.0.1:8000:8000"
      # 容器内端口固定 8000（不读 SERVER_PORT），换主机端口只改左边
      - "8000:8000"
    # 主配置：DeepSeek 密钥、限流、上限等（与本地直跑共用）。只在运行时注入，不进镜像
    env_file:
      - path: ../backend_fastapi/.env
        required: true
    # 覆盖 .env 中面向本地直跑的值；可在 docker/.env 用 BACKEND_* 调整
    environment:
      # 服务名 + 容器内端口；账号密码与 mysql 服务共用 docker/.env
      DATABASE_URL: "mysql+asyncmy://${MYSQL_APP_USER:-english_app}:${MYSQL_APP_PASSWORD:?MYSQL_APP_PASSWORD 未设置（docker/.env）}@mysql:3306/english_learning?charset=utf8mb4"
      TEST_DATABASE_URL: ""
      OCR_SERVICE_URL: http://paddle_ocr:8866
      OCR_MODE: ${BACKEND_OCR_MODE:-docker}
      AI_FALLBACK_ENABLED: ${BACKEND_AI_FALLBACK_ENABLED:-false}
      CORS_ALLOW_ORIGINS: ${BACKEND_CORS_ALLOW_ORIGINS:-}
      API_DOCS_ENABLED: "false"
      DEBUG: "false"
      LOG_LEVEL: ${BACKEND_LOG_LEVEL:-INFO}
    depends_on:
      mysql:
        condition: service_healthy
      paddle_ocr:
        condition: service_started
    restart: unless-stopped
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  mysql_data:
    # 固定卷名，不随 compose 项目名变化
    name: english_learning_mysql_data
