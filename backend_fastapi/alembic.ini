# Alembic config. Keep this file ASCII-only: alembic reads it with the locale
# encoding (GBK on Chinese Windows).
# The database URL is NOT stored here; env.py reads it from app.core.config.settings.
#   dev db:  venv\Scripts\python -m alembic upgrade head
#   test db: venv\Scripts\python -m alembic -x target=test upgrade head
[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
