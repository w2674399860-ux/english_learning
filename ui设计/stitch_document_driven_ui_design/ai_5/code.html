<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>@layer base{html,body{width:100vw;margin:0;padding:0;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "primary-fixed": "#ffd9df", "on-secondary-fixed": "#0e2000", "on-secondary": "#ffffff", "on-primary-container": "#640028", "tertiary-fixed-dim": "#e2c469", "surface-container-low": "#f7f3ec", "primary-fixed-dim": "#ffb1c0", "on-secondary-container": "#407100", "secondary-container": "#b8f47a", "on-surface": "#1c1c18", "secondary": "#3c6a00", "inverse-on-surface": "#f4f0e9", "error": "#ba1a1a", "surface-dim": "#dddad3", "on-background": "#1c1c18", "on-primary": "#ffffff", "primary": "#b32053", "tertiary-fixed": "#ffe083", "secondary-fixed-dim": "#9dd761", "inverse-primary": "#ffb1c0", "tertiary-container": "#c5a951", "inverse-surface": "#31302c", "on-tertiary-container": "#4e3e00", "surface-container": "#f1ede6", "tertiary": "#725c06", "on-tertiary": "#ffffff", "on-error-container": "#93000a", "surface": "#fdf9f2", "surface-bright": "#fdf9f2", "surface-container-highest": "#e6e2db", "on-tertiary-fixed-variant": "#564500", "primary-container": "#ff5c8a", "outline": "#8c7075", "surface-container-lowest": "#ffffff", "surface-variant": "#e6e2db", "on-primary-fixed": "#3f0017", "on-error": "#ffffff", "background": "#fdf9f2", "on-primary-fixed-variant": "#90003d", "surface-tint": "#b32053", "on-tertiary-fixed": "#231b00", "on-surface-variant": "#584045", "error-container": "#ffdad6", "surface-container-high": "#ebe8e1", "on-secondary-fixed-variant": "#2c5000", "secondary-fixed": "#b8f47a", "outline-variant": "#e0bec3" }, borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, spacing: { "space-sm": "0.5rem", "space-xs": "0.25rem", "gutter": "1rem", "space-lg": "1.5rem", "space-md": "1rem", "margin": "1.25rem", "space-xl": "2rem" }, fontFamily: { "label-lg": ["Plus Jakarta Sans"], "display-lg": ["Bricolage Grotesque"], "label-sm": ["Plus Jakarta Sans"], "headline-sm": ["Bricolage Grotesque"], "body-sm": ["Plus Jakarta Sans"], "body-md": ["Plus Jakarta Sans"], "headline-lg": ["Bricolage Grotesque"], "body-lg": ["Plus Jakarta Sans"], "display-lg-mobile": ["Bricolage Grotesque"], "headline-md": ["Bricolage Grotesque"], "label-md": ["Plus Jakarta Sans"] }, fontSize: { "label-lg": ["16px", { lineHeight: "22px", fontWeight: "700" }], "display-lg": ["38px", { lineHeight: "46px", fontWeight: "800" }], "label-sm": ["11px", { lineHeight: "14px", fontWeight: "700" }], "headline-sm": ["18px", { lineHeight: "26px", fontWeight: "700" }], "body-sm": ["13px", { lineHeight: "18px", fontWeight: "500" }], "body-md": ["15px", { lineHeight: "22px", fontWeight: "500" }], "headline-lg": ["26px", { lineHeight: "34px", fontWeight: "700" }], "body-lg": ["17px", { lineHeight: "26px", fontWeight: "500" }], "display-lg-mobile": ["30px", { lineHeight: "38px", fontWeight: "800" }], "headline-md": ["22px", { lineHeight: "30px", fontWeight: "700" }], "label-md": ["14px", { lineHeight: "18px", fontWeight: "700" }] } } } };</script><style>

  </head><body class="bg-surface text-on-surface font-body-md text-body-md min-h-screen flex flex-col antialiased selection:bg-primary-fixed selection:text-on-primary-fixed"><header class="fixed top-0 inset-x-0 z-50 bg-surface/85 backdrop-blur-xl pt-safe shadow-[0_1px_8px_rgba(0,0,0,0.04)]"><div class="h-16 px-margin flex items-center justify-between relative"><button aria-label="返回" class="w-11 h-11 rounded-full flex items-center justify-center text-on-surface-variant hover:text-on-surface hover:bg-surface-container-high transition-colors -ml-space-xs" onclick="history.back()"><span class="material-symbols-outlined text-[24px]">arrow_back</span></button><h1 class="absolute left-1/2 -translate-x-1/2 text-center font-headline-sm text-headline-sm text-on-surface pointer-events-none tracking-tight">修改密码</h1><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center shrink-0"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></header><main class="flex-1 flex flex-col relative w-full pt-16 pb-safe bg-surface px-margin"><div class="flex flex-col w-full pb-8 space-y-space-md">
<!-- 顶部当前账号提示小卡片 -->
<section class="w-full bg-surface-container-lowest rounded-xl p-space-md shadow-[3px_3px_0px_#2D2926] relative overflow-hidden transition-all">
<div class="flex items-center justify-between gap-space-sm">
<div class="flex items-center gap-space-sm min-w-0">
<div class="w-10 h-10 rounded-full bg-primary-fixed flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-on-primary-fixed text-[22px]">face_6</span>
</div>
<div class="flex flex-col min-w-0">
<span class="font-label-sm text-label-sm text-on-surface-variant truncate">当前登录账号</span>
<span class="font-headline-sm text-headline-sm text-on-surface truncate tracking-tight">mia_2026</span>
</div>
</div>
<div class="flex items-center gap-1.5 px-space-sm py-1 rounded-full bg-secondary-container text-on-secondary-container shrink-0">
<span class="material-symbols-outlined text-[15px]" style="font-variation-settings: 'FILL' 1;">verified_user</span>
<span class="font-label-sm text-label-sm whitespace-nowrap">保护中 · 邮箱已绑定</span>
</div>
</div>
</section>
<!-- 表单核心卡片 -->
<section class="w-full bg-surface-container-lowest rounded-xl p-space-md shadow-[3px_3px_0px_#2D2926] space-y-space-md">
<!-- 卡片头部标题 -->
<div class="flex items-center justify-between pb-space-xs">
<div class="flex items-center gap-2">
<span class="w-2.5 h-4.5 rounded-full bg-primary-container"></span>
<h2 class="font-headline-sm text-headline-sm text-on-surface">设置新登录密码</h2>
</div>
<span class="font-label-sm text-label-sm px-2.5 py-1 rounded-full bg-tertiary-fixed text-on-tertiary-fixed font-bold">
        8位以上
      </span>
</div>
<form class="space-y-space-md" id="passwordForm" onsubmit="event.preventDefault();">
<!-- 字段 1：当前密码 -->
<div class="space-y-1.5">
<label class="flex items-center gap-1.5 font-label-md text-label-md text-on-surface" for="currentPassword">
<span class="material-symbols-outlined text-[18px] text-primary">key</span>
<span>当前密码</span>
</label>
<div class="relative flex items-center">
<input class="w-full h-14 bg-surface-container-low rounded-xl px-4 pr-12 font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none focus:bg-tertiary-fixed/20 transition-all" id="currentPassword" placeholder="请输入当前密码" type="password"/>
<button aria-label="显示或隐藏密码" class="absolute right-3 w-9 h-9 rounded-lg flex items-center justify-center text-on-surface-variant hover:text-on-surface transition-colors" onclick="togglePasswordVisibility('currentPassword', this)" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
</div>
<!-- 字段 2：新密码 -->
<div class="space-y-1.5">
<label class="flex items-center gap-1.5 font-label-md text-label-md text-on-surface" for="newPassword">
<span class="material-symbols-outlined text-[18px] text-primary">lock</span>
<span>新密码</span>
</label>
<div class="relative flex items-center">
<input class="w-full h-14 bg-surface-container-low rounded-xl px-4 pr-12 font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none focus:bg-tertiary-fixed/20 transition-all" id="newPassword" oninput="evaluatePasswordStrength(this.value)" placeholder="请输入新密码（至少8位）" type="password"/>
<button aria-label="显示或隐藏密码" class="absolute right-3 w-9 h-9 rounded-lg flex items-center justify-center text-on-surface-variant hover:text-on-surface transition-colors" onclick="togglePasswordVisibility('newPassword', this)" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
<p class="font-body-sm text-body-sm text-on-surface-variant flex items-center gap-1 pt-0.5">
<span class="material-symbols-outlined text-[15px] text-tertiary">lightbulb</span>
          提示：密码至少 8 位，建议包含字母与数字组合
        </p>
<!-- 密码安全强度指示器 -->
<div class="pt-1.5 space-y-1">
<div class="flex items-center justify-between text-on-surface-variant">
<span class="font-label-sm text-label-sm">安全强度</span>
<span class="font-label-sm text-label-sm text-on-surface-variant" id="strengthText">尚未输入</span>
</div>
<div class="grid grid-cols-3 gap-2 h-2.5">
<div class="h-full rounded-full bg-surface-container-highest transition-colors" id="bar1"></div>
<div class="h-full rounded-full bg-surface-container-highest transition-colors" id="bar2"></div>
<div class="h-full rounded-full bg-surface-container-highest transition-colors" id="bar3"></div>
</div>
</div>
</div>
<!-- 字段 3：确认新密码 -->
<div class="space-y-1.5">
<label class="flex items-center gap-1.5 font-label-md text-label-md text-on-surface" for="confirmPassword">
<span class="material-symbols-outlined text-[18px] text-secondary">verified</span>
<span>确认新密码</span>
</label>
<div class="relative flex items-center">
<input class="w-full h-14 bg-surface-container-low rounded-xl px-4 pr-12 font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none focus:bg-tertiary-fixed/20 transition-all" id="confirmPassword" placeholder="请再次输入新密码" type="password"/>
<button aria-label="显示或隐藏密码" class="absolute right-3 w-9 h-9 rounded-lg flex items-center justify-center text-on-surface-variant hover:text-on-surface transition-colors" onclick="togglePasswordVisibility('confirmPassword', this)" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
</div>
<!-- 保存提交按钮 -->
<div class="pt-2">
<button class="w-full h-[52px] rounded-full bg-primary-container text-on-primary font-label-lg text-label-lg tracking-wide shadow-[0px_4px_0px_#2D2926] active:translate-y-[3px] active:shadow-[0px_1px_0px_#2D2926] flex items-center justify-center gap-2 transition-all cursor-pointer" onclick="handleSavePassword()" type="button">
<span class="material-symbols-outlined text-[22px]">check_circle</span>
<span>保存并更新密码</span>
</button>
</div>
</form>
</section>
<!-- 底部安全便签纸小卡片 -->
<section class="w-full bg-tertiary-fixed/30 rounded-xl p-space-md shadow-[3px_3px_0px_#2D2926] relative overflow-hidden">
<div class="flex items-start gap-space-sm">
<div class="w-8 h-8 rounded-full bg-tertiary-fixed flex items-center justify-center shrink-0 mt-0.5">
<span class="material-symbols-outlined text-on-tertiary-fixed text-[18px]">lightbulb</span>
</div>
<div class="space-y-1 text-on-surface">
<h3 class="font-label-md text-label-md text-on-surface">安全小贴士</h3>
<p class="font-body-sm text-body-sm text-on-surface-variant leading-relaxed">
          修改成功后，其他已登录设备可能需要重新验证登录。若忘记当前密码，可联系班级管理员重置。
        </p>
</div>
</div>
</section>
</div>
<script>
  function togglePasswordVisibility(inputId, buttonEl) {
    const input = document.getElementById(inputId);
    const icon = buttonEl.querySelector('.material-symbols-outlined');
    if (!input || !icon) return;

    if (input.type === 'password') {
      input.type = 'text';
      icon.textContent = 'visibility';
      buttonEl.classList.add('text-primary');
    } else {
      input.type = 'password';
      icon.textContent = 'visibility_off';
      buttonEl.classList.remove('text-primary');
    }
  }

  function evaluatePasswordStrength(val) {
    const bar1 = document.getElementById('bar1');
    const bar2 = document.getElementById('bar2');
    const bar3 = document.getElementById('bar3');
    const label = document.getElementById('strengthText');
    if (!bar1 || !bar2 || !bar3 || !label) return;

    const baseClass = 'h-full rounded-full transition-colors ';
    bar1.className = baseClass + 'bg-surface-container-highest';
    bar2.className = baseClass + 'bg-surface-container-highest';
    bar3.className = baseClass + 'bg-surface-container-highest';

    if (!val || val.length === 0) {
      label.textContent = '尚未输入';
      label.className = 'font-label-sm text-label-sm text-on-surface-variant';
      return;
    }

    let score = 0;
    if (val.length >= 8) score++;
    if (/[A-Za-z]/.test(val) && /[0-9]/.test(val)) score++;
    if (/[^A-Za-z0-9]/.test(val) && val.length >= 10) score++;

    if (score <= 1) {
      bar1.className = baseClass + 'bg-primary-container';
      label.textContent = '弱 · 建议增加长度与字符组合';
      label.className = 'font-label-sm text-label-sm text-primary';
    } else if (score === 2) {
      bar1.className = baseClass + 'bg-tertiary-fixed-dim';
      bar2.className = baseClass + 'bg-tertiary-fixed-dim';
      label.textContent = '中等 · 强度适中';
      label.className = 'font-label-sm text-label-sm text-tertiary';
    } else {
      bar1.className = baseClass + 'bg-secondary';
      bar2.className = baseClass + 'bg-secondary';
      bar3.className = baseClass + 'bg-secondary';
      label.textContent = '强 · 密码很安全';
      label.className = 'font-label-sm text-label-sm text-secondary font-bold';
    }
  }

  function handleSavePassword() {
    const current = document.getElementById('currentPassword').value;
    const newPwd = document.getElementById('newPassword').value;
    const confirm = document.getElementById('confirmPassword').value;

    if (!current) {
      alert('请输入当前密码以验证身份');
      return;
    }
    if (!newPwd || newPwd.length < 8) {
      alert('新密码长度不能少于 8 位');
      return;
    }
    if (newPwd !== confirm) {
      alert('两次输入的新密码不一致，请仔细检查');
      return;
    }
    alert('密码修改成功！下次登录请使用新密码。');
  }
</script></main></body></html>
