<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "on-secondary-fixed-variant": "#2c5000", "surface": "#fdf9f2", "outline-variant": "#e0bec3", "secondary-fixed-dim": "#9dd761", "primary": "#b32053", "on-surface-variant": "#584045", "on-secondary": "#ffffff", "on-tertiary": "#ffffff", "error": "#ba1a1a", "on-primary": "#ffffff", "on-error-container": "#93000a", "on-primary-fixed": "#3f0017", "surface-tint": "#b32053", "inverse-primary": "#ffb1c0", "tertiary-fixed": "#ffe083", "primary-fixed-dim": "#ffb1c0", "on-background": "#1c1c18", "surface-bright": "#fdf9f2", "secondary-container": "#b8f47a", "on-secondary-fixed": "#0e2000", "surface-variant": "#e6e2db", "secondary-fixed": "#b8f47a", "surface-container-highest": "#e6e2db", "surface-container": "#f1ede6", "on-tertiary-fixed-variant": "#564500", "on-tertiary-container": "#4e3e00", "tertiary": "#725c06", "inverse-on-surface": "#f4f0e9", "surface-container-high": "#ebe8e1", "on-primary-container": "#640028", "inverse-surface": "#31302c", "surface-container-lowest": "#ffffff", "on-tertiary-fixed": "#231b00", "tertiary-fixed-dim": "#e2c469", "outline": "#8c7075", "background": "#fdf9f2", "on-error": "#ffffff", "on-secondary-container": "#407100", "on-surface": "#1c1c18", "tertiary-container": "#c5a951", "error-container": "#ffdad6", "on-primary-fixed-variant": "#90003d", "surface-dim": "#dddad3", "primary-fixed": "#ffd9df", "primary-container": "#ff5c8a", "surface-container-low": "#f7f3ec", "secondary": "#3c6a00" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "margin": "1.25rem", "space-md": "1rem", "space-sm": "0.5rem", "space-lg": "1.5rem", "gutter": "1rem", "space-xl": "2rem", "space-xs": "0.25rem" }, "fontFamily": { "bo <!-- 顶部轻巧手绘提示条 (Delight micro-banner) -->
<div class="mt-space-sm mb-space-sm w-full flex items-center justify-between px-space-md py-space-xs rounded-xl bg-tertiary-fixed text-on-tertiary-fixed shadow-sm">
<div class="flex items-center gap-space-xs min-w-0">
<span class="material-symbols-outlined text-headline-sm text-tertiary flex-shrink-0" style="font-variation-settings: 'FILL' 1;">auto_stories</span>
<p class="font-label-sm text-label-sm truncate">登录后即可同步你的 57 篇绘本故事与打卡勋章</p>
</div>
<span class="material-symbols-outlined text-label-md text-on-tertiary-fixed flex-shrink-0">arrow_back_ios_new</span>
</div>
<!-- 1. 顶部插画展示区 -->
<section class="relative w-full flex flex-col items-center pt-space-xs pb-space-sm text-center">
<!-- 装饰性漂浮小元素 (手绘氛围) -->
<div class="absolute -top-1 left-6 flex items-center gap-1 text-primary-container animate-pulse">
<span class="material-symbols-outlined text-headline-md" style="font-variation-settings: 'FILL' 1;">favorite</span>
</div>
<div class="absolute top-8 right-8 text-secondary flex items-center">
<span class="material-symbols-outlined text-headline-sm" style="font-variation-settings: 'FILL' 1;">eco</span>
</div>
<div class="absolute bottom-20 left-8 text-secondary-container">
<span class="material-symbols-outlined text-headline-sm rotate-45" style="font-variation-settings: 'FILL' 1;">energy_savings_leaf</span>
</div>
<!-- 吉祥物打招呼对话气泡 -->
<div class="relative mb-space-xs px-space-md py-space-xs rounded-full bg-surface-container-lowest text-on-surface shadow-sm">
<div class="flex items-center gap-space-xs">
<span class="material-symbols-outlined text-headline-sm text-primary-container" style="font-variation-settings: 'FILL' 1;">waving_hand</span>
<span class="font-label-md text-label-md">Hi! 一起开心读故事学英语吧～</span>
</div>
<!-- 气泡手绘小尾巴 -->
<div class="absolute left-1/2 -bottom-2 -translate-x-1/2 w-0 h-0 border-x-8 border-x-transparent border-t-8 border-t-surface-container-lowest"></div>
</div>
<!-- 吉祥物插画头像 -->
<div class="relative w-28 h-28 my-space-xs flex items-center justify-center">
<!-- 柔和粉润底晕 -->
<div class="absolute inset-0 rounded-full bg-primary-fixed opacity-70"></div>
<img alt="App原创绘本吉祥物小书" class="relative w-24 h-24 object-contain rounded-2xl drop-shadow-sm transition-transform hover:scale-105 active:scale-95 duration-200" src="https://lh3.googleusercontent.com/aida/AEtjO1VghlXS_pA9BxXi9x03mVyDlxQ54JWnPtD7p-cc4nSAuhOG0tp38pDu71-89yp8Gk-rEKy01UUOz6aJunREW2USkA62UOnIBv3XGv44MejOQUVRpV1Yae3gCTSiXv-zaAzkbZZssW8QR5Y1GVuN4BCg1TKeC0SGQ09RAWX8WQWehORzfpxuCAzK-id5V65pfQZQL14Kj70UNik393ZP8nLQ14buxCPa332SnXI1cmBrqyN23amnYHeDXCLV"/>
<!-- 小光芒点缀 -->
<div class="absolute -top-1 -right-1 text-tertiary-fixed-dim">
<span class="material-symbols-outlined text-headline-md" style="font-variation-settings: 'FILL' 1;">hotel_class</span>
</div>
</div>
<!-- 品牌标题区 -->
<h1 class="font-display-lg-mobile text-display-lg-mobile text-primary tracking-tight mt-space-xs">
      AI 英语学习
    </h1>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-1 flex items-center justify-center gap-1.5">
<span>拍照识词</span>
<span class="w-1 h-1 rounded-full bg-outline"></span>
<span>绘本童话</span>
<span class="w-1 h-1 rounded-full bg-outline"></span>
<span>轻松突破词汇</span>
</p>
</section>
<!-- 2. 登录主卡片容器 -->
<main class="w-full mt-space-xs">
<div class="w-full bg-surface-container-lowest rounded-xl p-space-lg shadow-md flex flex-col gap-space-md relative overflow-hidden">
<!-- 卡片装饰色块点缀 -->
<div class="absolute top-0 right-0 w-16 h-16 bg-secondary-fixed/30 rounded-bl-full pointer-events-none"></div>
<!-- 卡片标题 -->
<div class="flex items-center justify-between">
<div class="flex items-center gap-space-xs">
<span class="w-2.5 h-6 rounded-full bg-primary-container inline-block"></span>
<h2 class="font-headline-lg text-headline-lg text-on-surface">登录</h2>
</div>
<span class="font-label-sm text-label-sm text-secondary px-space-sm py-0.5 rounded-full bg-secondary-container/50">
          初学者专享
        </span>
</div>
<!-- 表单区域 -->
<form class="flex flex-col gap-space-md mt-space-xs" id="loginForm" onsubmit="event.preventDefault(); handleLogin();">
<!-- 用户名输入 -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface flex items-center gap-1.5" for="usernameInput">
<span class="material-symbols-outlined text-headline-sm text-primary" style="font-variation-settings: 'FILL' 1;">account_circle</span>
            用户名
          </label>
<div class="relative w-full">
<input autocomplete="username" class="w-full min-h-[52px] px-space-md rounded-xl bg-surface-container-low font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:bg-surface-container-lowest focus:ring-0 transition-all shadow-inner" id="usernameInput" name="username" placeholder="请输入用户名 (3-20位)" type="text"/>
</div>
</div>
<!-- 密码输入 -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface flex items-center justify-between" for="passwordInput">
<span class="flex items-center gap-1.5">
<span class="material-symbols-outlined text-headline-sm text-secondary" style="font-variation-settings: 'FILL' 1;">lock</span>
              密码
            </span>
<span class="font-label-sm text-label-sm text-on-surface-variant font-normal">不少于 6 位</span>
</label>
<div class="relative w-full flex items-center">
<input autocomplete="current-password" class="w-full min-h-[52px] pl-space-md pr-12 rounded-xl bg-surface-container-low font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:bg-surface-container-lowest focus:ring-0 transition-all shadow-inner" id="passwordInput" name="password" placeholder="请输入登录密码" type="password"/>
<button aria-label="显示或隐藏密码" class="absolute right-3 p-2 rounded-lg text-on-surface-variant active:bg-surface-container hover:text-on-surface flex items-center justify-center transition-colors" id="togglePasswordBtn" onclick="togglePasswordVisibility()" type="button">
<span class="material-symbols-outlined text-headline-sm" id="eyeIcon">visibility</span>
</button>
</div>
</div>
<!-- 动态交互反馈槽位 (默认隐藏，JS 触发) -->
<div class="hidden items-center gap-2 p-space-xs rounded-lg bg-error-container text-on-error-container" id="formAlert">
<span class="material-symbols-outlined text-headline-sm flex-shrink-0">error</span>
<span class="font-body-sm text-body-sm" id="alertMessage">请输入正确的用户名和密码</span>
</div>
<!-- 主操作按钮 (登录) -->
<button class="w-full min-h-[56px] mt-space-xs rounded-full bg-primary-container text-on-primary font-headline-sm text-headline-sm flex items-center justify-center gap-2 shadow-md active:scale-95 active:shadow-sm transition-all duration-150 cursor-pointer" id="submitBtn" type="submit">
<span>立即登录</span>
<span class="material-symbols-outlined text-headline-sm" style="font-variation-settings: 'FILL' 1;">arrow_circle_right</span>
</button>
<!-- 注册辅助链接 -->
<div class="flex items-center justify-center gap-1.5 py-space-xs">
<span class="font-body-md text-body-md text-on-surface-variant">还没有账号？</span>
<button class="font-label-lg text-label-lg text-secondary active:opacity-70 flex items-center underline decoration-2 underline-offset-4 decoration-secondary-container" onclick="triggerRegisterSheet()" type="button">
            注册新学伴
          </button>
</div>
</form>
</div>
</main>
<!-- 3. 底部友好提示栏 (忘记密码 / 帮助通道) -->
<footer class="w-full mt-space-md mb-space-sm flex flex-col items-center">
<div class="inline-flex items-center gap-1.5 px-space-md py-space-xs rounded-full bg-surface-container-high text-on-surface-variant shadow-sm">
<span class="material-symbols-outlined text-body-lg text-tertiary" style="font-variation-settings: 'FILL' 1;">vpn_key</span>
<span class="font-body-sm text-body-sm">忘记密码？请联系班级管理员重置。</span>
</div>
<div class="mt-space-sm flex items-center justify-center gap-space-sm font-label-sm text-label-sm text-outline">
<span>温润绘本排版</span>
<span>•</span>
<span>低压力愉悦学习</span>
</div>
</footer>
<!-- 模拟提示 Toast 悬浮盒 -->
<div class="fixed bottom-8 left-1/2 -translate-x-1/2 max-w-[90vw] px-space-md py-space-xs rounded-full bg-inverse-surface text-inverse-on-surface shadow-lg opacity-0 pointer-events-none transition-all duration-300 z-50 flex items-center gap-2" id="toastBox">
<span class="material-symbols-outlined text-headline-sm text-secondary-container" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="font-label-md text-label-md" id="toastText">欢迎回来！正在翻开你的故事书...</span>
</div>
</div>
<script>
  function togglePasswordVisibility() {
    const passwordInput = document.getElementById('passwordInput');
    const eyeIcon = document.getElementById('eyeIcon');
    if (!passwordInput || !eyeIcon) return;

    if (passwordInput.type === 'password') {
      passwordInput.type = 'text';
      eyeIcon.textContent = 'visibility_off';
    } else {
      passwordInput.type = 'password';
      eyeIcon.textContent = 'visibility';
    }
  }

  function showToast(message) {
    const toast = document.getElementById('toastBox');
    const toastText = document.getElementById('toastText');
    if (!toast || !toastText) return;

    toastText.textContent = message;
    toast.classList.remove('opacity-0', 'pointer-events-none', '-translate-y-2');
    toast.classList.add('opacity-100', 'translate-y-0');

    setTimeout(() => {
      toast.classList.remove('opacity-100', 'translate-y-0');
      toast.classList.add('opacity-0', 'pointer-events-none', '-translate-y-2');
    }, 2400);
  }

  function handleLogin() {
    const userInput = document.getElementById('usernameInput');
    const passInput = document.getElementById('passwordInput');
    const alertBox = document.getElementById('formAlert');
    const alertMsg = document.getElementById('alertMessage');

    const username = userInput ? userInput.value.trim() : '';
    const password = passInput ? passInput.value.trim() : '';

    if (!username || !password) {
      if (alertBox && alertMsg) {
        alertMsg.textContent = '请输入用户名和密码后再出发噢～';
        alertBox.classList.remove('hidden');
        alertBox.classList.add('flex');
      }
      return;
    }

    if (username.length < 3) {
      if (alertBox && alertMsg) {
        alertMsg.textContent = '用户名长度需在 3-20 位之间';
        alertBox.classList.remove('hidden');
        alertBox.classList.add('flex');
      }
      return;
    }

    if (alertBox) {
      alertBox.classList.add('hidden');
      alertBox.classList.remove('flex');
    }

    showToast('登录成功！正在进入奇妙英语绘本屋 ✨');
  }

  function triggerRegisterSheet() {
    showToast('注册通道已开启，欢迎新朋友加入！🌱');
  }
</script></main></body></html>
